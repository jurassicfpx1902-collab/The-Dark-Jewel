<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>THE DARK JEWEL — Operation NO DARK</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="game-container">

        <!-- Efeitos visuais -->
        <div id="scanlines"></div>
        <div id="vignette"></div>

        <!-- Canvas principal -->
        <canvas
            id="gameCanvas"
            width="800"
            height="600"
        ></canvas>


        <!-- =========================
             HUD
        ========================== -->

        <div id="hud">

            <div class="hud-panel" id="hud-agent">
                AGENTE: BUCK
            </div>

            <div class="hud-panel" id="hud-status">
                STATUS: OCULTO
            </div>

            <div class="hud-panel" id="hud-objective">
                OBJETIVO: RECUPERAR ARQUIVO
            </div>

        </div>


        <!-- =========================
             MENU PRINCIPAL
        ========================== -->

        <div id="menu-screen" class="screen active">

            <h1>THE DARK JEWEL</h1>

            <div class="subtitle">
                OPERATION // NO DARK
            </div>

            <p>LOCAL: BASE DINAMARQUESA</p>
            <p>AGENTE: BUCK</p>

            <br>

            <button id="btn-start" class="btn">
                INICIAR MISSÃO
            </button>

            <button id="btn-audio" class="btn">
                ÁUDIO: LIGADO
            </button>

        </div>


        <!-- =========================
             GAME OVER
        ========================== -->

        <div id="gameover-screen" class="screen">

            <h1 class="danger">
                ALERTA // DETECTADO
            </h1>

            <p>
                O Agente Buck foi capturado
                pelas forças de patrulha.
            </p>

            <button id="btn-restart" class="btn">
                REINICIAR OPERAÇÃO
            </button>

        </div>


        <!-- =========================
             VITÓRIA
        ========================== -->

        <div id="victory-screen" class="screen">

            <h1 class="success">
                MISSÃO CONCLUÍDA
            </h1>

            <p>
                Dados recuperados e extração
                realizada com sucesso.
            </p>

            <button id="btn-victory-restart" class="btn">
                JOGAR NOVAMENTE
            </button>

        </div>


        <!-- =========================
             CONTROLES MOBILE
        ========================== -->

        <div id="mobile-controls">

            <div id="dpad">

                <div></div>

                <div
                    class="touch-btn"
                    id="btn-up"
                >
                    ▲
                </div>

                <div></div>


                <div
                    class="touch-btn"
                    id="btn-left"
                >
                    ◄
                </div>

                <div></div>

                <div
                    class="touch-btn"
                    id="btn-right"
                >
                    ►
                </div>


                <div></div>

                <div
                    class="touch-btn"
                    id="btn-down"
                >
                    ▼
                </div>

                <div></div>

            </div>


            <div
                class="touch-btn crouch-btn"
                id="btn-crouch"
            >
                AGACH
            </div>

        </div>

    </div>


    <!-- =========================
         SISTEMAS DO JOGO
    ========================== -->

    <script src="js/audio.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/vision.js"></script>

    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>

    <script src="js/missions.js"></script>
    <script src="js/ui.js"></script>

    <script src="js/game.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
